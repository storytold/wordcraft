[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/wordcraft", "apps/wordcraft-cli", "xtask"]

[workspace.metadata.cl]
# Port build loop (craft-ui-port-kit): every member but xtask, so the baseline covers the
# non-UI crates whose framework dependencies the next pin moves too.
selection = ["wordcraft", "wordcraft-ui-egui", "wordcraft-web", "wordcraft-cli", "wordcraft-control-key", "wordcraft-doc", "wordcraft-docbin", "wordcraft-docx", "wordcraft-engine", "wordcraft-fonts", "wordcraft-formats", "wordcraft-geom", "wordcraft-layout", "wordcraft-mcp", "wordcraft-pdf", "wordcraft-render", "wordcraft-zotero"]
tracked = ["egui", "eframe", "wordcraft-ui-egui"]
unset_env = ["CARGO_INCREMENTAL", "WORDCRAFT_REQUIRE_WINRES", "CRAFT_FONTS_REQUIRED", "CRAFT_I18N_REQUIRED", "CRAFT_PROOF_EMBED"]
run_slots = 3
test_threads = 4

[workspace.package]
version = "0.18.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/wordcraft"

[workspace.dependencies]
# internal
wordcraft-geom = { path = "crates/geom" }
wordcraft-doc = { path = "crates/doc" }
wordcraft-fonts = { path = "crates/fonts" }
wordcraft-layout = { path = "crates/layout" }
wordcraft-docx = { path = "crates/docx" }
wordcraft-docbin = { path = "crates/docbin" }
wordcraft-formats = { path = "crates/formats" }
wordcraft-render = { path = "crates/render" }
wordcraft-pdf = { path = "crates/pdf" }
# Until storytold/craft-libs#2658 (windowed dialogs on DialogHost, for this PR) merges into
# craft-libs next, the craft-libs crates come from mocenigo/craft-libs-mine @ windowed-dialogs
# (upstream next + that one commit); then they move back to a storytold rev, as one rev.
# Proofing is craft-libs' craft-proof (it was crates/proof); its Language data is craft-i18n's
# language-data/, embedded from CRAFT_I18N_DIR (craft-i18n.rev). The package keeps the
# `wordcraft-proof` name here so `wordcraft_proof::` paths are unchanged.
# craft-proof is storytold/craft-libs main at 93dac78c. That tree has #590 (ca-ES-valencia
# reads the ca-valencia pack), #589 (French elision suggestions first), #497 (flag-based
# compounding), #496 (review follow-ups, en-AU) and the merged #482–#490/#495 stack; the font
# store's `language-pack` kind is #486 (CP4.1).
wordcraft-proof = { package = "craft-proof", git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-font-store = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-font-catalog = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-ssip = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
wordcraft-engine = { path = "crates/engine" }
wordcraft-mcp = { path = "crates/mcp" }
wordcraft-zotero = { path = "crates/zotero" }
wordcraft-control-key = { path = "crates/control-key" }
wordcraft-ui-egui = { path = "crates/ui-egui" }
craft-codepage = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0", default-features = false }
craft-ui-test-kit = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-keymap = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-metafile = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-script = "0.5"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
# WOFF / WOFF2 web fonts added by the user (#582): pure Rust (MIT); its brotli and zlib decoders
# (brotli-decompressor, flate2) are already in the tree.
wuff = "0.2.9"
# WOFF2's brotli stream, decoded ahead of wuff so its glyph point counts are checked first (#3703).
# The same crate and version wuff already decodes it with (no new code in the build): pure Rust,
# `forbid(unsafe_code)` in its default build, no_std-capable (builds for wasm), BSD-3-Clause/MIT.
brotli-decompressor = "5"
vello_cpu = "0.2"
image = { version = "0.25", default-features = false }
craft-image-codecs = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-tiff = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-pdf = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0", default-features = false, features = ["write"] }

craft-wordmodel = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-docx = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-mcp-server = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-rtf = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0", features = ["doc"] }
craft-doc-binary = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-flow = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-odf = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0", features = ["text"] }
craft-markdown = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-html = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0", features = ["flow"] }
craft-latex = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-math = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-mime = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0", features = ["detect"] }
craft-sheet = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-ods = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-xls = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-xlsx = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-xml = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
craft-zip = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs", version = "=0.1.0" }
# zlib streams (compressed metafile pictures in `.doc` drawings); already in the lock as a dependency of other crates.
miniz_oxide = "0.9"
cfb = "0.15"
# Legacy text encodings (GBK/GB18030, Big5, Shift_JIS, EUC-KR, single-byte code pages) for plain
# text and CSV recipient lists (#778): encoding_rs ((Apache-2.0 OR MIT) AND BSD-3-Clause), pure
# Rust (Firefox's). Detection is craft-mime's `detect` feature.
encoding_rs = "0.8"
# chardetng (Apache-2.0 OR MIT): only the formats test oracle for the old detector uses it directly.
chardetng = "1"
# Password-protected (agile-encrypted) Word documents: pure-Rust RustCrypto primitives.
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
getrandom = "0.3"
zeroize = "1"
# Unix open flags (O_NONBLOCK for the engine's checked file reads, #3666); already in the lock as a
# dependency of other crates.
libc = "0.2"

# time

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# A monotonic clock that works on native and in the browser (`performance.now()`).
web-time = "1.1"
rfd = "0.17"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[workspace.lints.rust]
# `deny`, not `forbid`, so the one exception AGENTS.md names can allow it.
unsafe_code = "deny"
# cargo llvm-cov sets `--cfg coverage`; timing tests skip themselves under its instrumentation.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Required by craft-pdf: the backend rejects writers that failed during unwinding.
# The framework's patches, which Cargo does not carry over to dependents: its vendored crates from craft-libs,
# and the egui and winit forks it builds with.
[patch.crates-io]
krilla = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs" }
hayro = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs" }
hayro-interpret = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs" }
hayro-syntax = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs" }
hayro-jbig2 = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs" }
hayro-cmap = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs" }
hayro-postscript = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs" }
linesweeper = { git = "https://github.com/mocenigo/craft-libs-mine", branch = "windowed-dialogs" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
emath = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "7e1c30d142bc7879d043e74b5ceb3ecfe7f51329" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

