[package]
name = "wordcraft-docbin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft reader for the Word 97-2003 binary file format (.doc, [MS-DOC])"

[lints]
workspace = true

[dependencies]
craft-doc-binary = { git = "https://github.com/storytold/craft-libs", rev = "75c70fa6a786240eb853e6267e25fc445f510cd0", version = "=0.1.0" }
craft-wordmodel = { git = "https://github.com/storytold/craft-libs", rev = "75c70fa6a786240eb853e6267e25fc445f510cd0", version = "=0.1.0" }
wordcraft-doc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
wordcraft-doc = { workspace = true, features = ["test-support"] }
cfb = { workspace = true }
