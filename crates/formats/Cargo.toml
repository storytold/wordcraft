[package]
name = "wordcraft-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX; Hangul (HWP, HWPX) import"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-geom = { workspace = true }
image = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
miniz_oxide = { workspace = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32): ODT change dates.
js-sys = "0.3"

[dev-dependencies]
proptest = { workspace = true }
