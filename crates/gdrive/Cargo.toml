[package]
name = "wordcraft-gdrive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft Google Drive client: OAuth 2.0 sign-in for installed apps (loopback + PKCE) and the Drive v3 calls to list, open and save documents"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
proptest = { workspace = true }
