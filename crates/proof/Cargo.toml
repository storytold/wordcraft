[package]
name = "wordcraft-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft proofing per language: spelling, suggestions, grammar checks and hyphenation for English (public-domain word list) and Polish (installed Hunspell dictionary, TeX patterns)"

[lints]
workspace = true

[dependencies]
log = { workspace = true }
miniz_oxide = "0.9"
unicode-normalization = "0.1"
# Thai word segmentation, word list (CC0) and spelling suggestions; no_std, nothing to install.
kham-core = "=0.8.2"

[dev-dependencies]
proptest = { workspace = true }
