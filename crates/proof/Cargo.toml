[package]
name = "wordcraft-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft proofing per language: spelling, suggestions, grammar checks and hyphenation for English (public-domain word list) and Polish (installed Hunspell dictionary, TeX patterns)"

[lints]
workspace = true

[dependencies]
log = { workspace = true }
miniz_oxide = "0.9"
unicode-normalization = "0.1"

# Harper's English grammar checks (#799) run on a background thread, which the web build lacks.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
harper-core = { version = "3.0.0", default-features = false }

[dev-dependencies]
proptest = { workspace = true }
