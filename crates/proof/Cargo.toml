[package]
name = "wordcraft-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft proofing per language: spelling, suggestions, grammar checks and hyphenation for English (public-domain word list) and Polish (installed Hunspell dictionary, TeX patterns)"

[lints]
workspace = true

[dependencies]
# Hunspell affix dictionaries, installed-dictionary discovery and language tags, shared with
# the other Craft apps (storytold/craft-libs#30). Pinned to the commit of storytold/craft-libs#31
# until it merges.
craft-proof = { git = "https://github.com/brzuchal/craft-libs", rev = "a3d4d487b6b717305085f65a235c973de8c15d59" }
log = { workspace = true }
miniz_oxide = "0.8"

[dev-dependencies]
proptest = { workspace = true }
