[package]
name = "wordcraft-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft plugin host: out-of-process plugins over JSON-RPC (commands, ribbon and menu items), installed from folders or GitHub"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
zip = { workspace = true }

# Installing plugins from GitHub (desktop and CLI; the web build can't run plugins).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

# A reference plugin written in Rust; the tests drive it as a real child process.
[[bin]]
name = "wordcraft-example-plugin"
path = "src/bin/example_plugin.rs"
test = false
doc = false
