[package]
name = "wordcraft-docx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft DOCX (OOXML WordprocessingML) reader and writer"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-geom = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
cfb = { workspace = true }
aes = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }

# The browser's `crypto.getRandomValues` for the salts and keys of encrypted saves.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
proptest = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
