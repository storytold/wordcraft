[package]
name = "wordcraft-collab-app"
description = "App-side collaboration session: transport, node map and delta application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The transport-free half (SyncState, Status, cursors) is shared with the web
# session in `collab-web`, so these dependencies are not target-gated.
[dependencies]
wordcraft-collab = { path = "../collab" }
wordcraft-collab-doc = { path = "../collab-doc" }
wordcraft-collab-engine = { path = "../collab-engine" }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
serde_json = { workspace = true }

# The native socket session.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wordcraft-collab-client = { path = "../collab-client" }
wordcraft-collab-ws = { path = "../collab-ws" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
