[package]
name = "wordcraft-collab-app"
description = "App-side collaboration session: transport, node map and delta application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# Native only, like the transport it wraps.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wordcraft-collab = { path = "../collab" }
wordcraft-collab-doc = { path = "../collab-doc" }
wordcraft-collab-engine = { path = "../collab-engine" }
wordcraft-collab-ws = { path = "../collab-ws" }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
