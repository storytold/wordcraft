[package]
name = "wordcraft-collab-web"
description = "Web-side collaboration session: the protocol over the browser's WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
wordcraft-collab = { path = "../collab" }
wordcraft-collab-client = { path = "../collab-client" }
wordcraft-collab-app = { path = "../collab-app" }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Event", "MessageEvent", "CloseEvent", "WebSocket", "BinaryType"] }

[lints]
workspace = true
