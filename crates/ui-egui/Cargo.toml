[package]
name = "wordcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
# The printing controls and the shared menus, and Open/Save against cloud storage and the share
# dialog (the `cloud` feature, which pulls in `share`). Pinned by revision to storytold/craft-libs,
# which is how this repository already reached craft-print: a real, reviewable storytold commit,
# not a personal fork. No backend is connected in this build, so `craft_ui::cloud::available` is
# false and every cloud page and menu item stays hidden; see `cloud_app`.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "93dac78c93a7f1fd66e2022edeb089233b1dc45a", features = ["cloud"] }
# The vendor-neutral cloud vocabulary (`EntryKind` for `CloudApp::paint_icon`). Same craft-libs rev
# as craft-ui; craft-ui's own `cloud` feature already resolves this crate from the same checkout.
craft-cloud = { git = "https://github.com/storytold/craft-libs", rev = "93dac78c93a7f1fd66e2022edeb089233b1dc45a" }
# Interface translations: lookup, fallback, plurals and system-locale matching over the craft-i18n
# catalogs that `build.rs` embeds from `CRAFT_I18N_DIR` (storytold/craft-i18n, pinned in
# `craft-i18n.rev`). Same craft-libs rev as craft-ui; it brings lazy per-locale parsing
# (storytold/craft-libs#247), ICU4X plural rules and bidi isolates around inserted values.
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "93dac78c93a7f1fd66e2022edeb089233b1dc45a" }
# One native window per open document: the window list, the Window menu and the egui viewports.
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "93dac78c93a7f1fd66e2022edeb089233b1dc45a", features = ["egui"] }
wordcraft-geom = { workspace = true, features = ["image"] }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-zotero = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
# Pictures pasted from the system clipboard arrive as pixels and are inserted as PNG (#45).
image = { workspace = true }
# The system's preferred interface languages (#8) and region (#838). Native: OS APIs; wasm:
# the browser's languages (`js`).
sys-locale = { version = "0.3", features = ["js"] }

# Linux only, where winit reports no system theme: the desktop portal's light/dark answer (see
# `desktop_theme.rs`). Already in the tree, with these features, through egui's own accessibility
# bus; pinned to one version so nothing is built twice.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

# Comment times in the user's own time zone (`local_time.rs`); the web app asks the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
craft-update = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"

[dev-dependencies]
cfb = { workspace = true }
# Producer tests simulate a globally exhausted IME revision allocator through the engine's
# explicit test-support feature; production builds of this crate never enable it.
wordcraft-engine = { workspace = true, features = ["test-support"] }
# kittest's own dev-dependencies do not propagate their font features. Declare the fonts the
# interface tests lay out explicitly: default faces plus monochrome emoji fallbacks.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
craft-zip = { workspace = true }
# #2726's regression test: the consumer the Windows adapter runs, fed with our updates.
# Pinned to the version egui already brings into the tree, so nothing is built twice.
accesskit_consumer = "=0.39.1"
# A reference `CloudBackend` over a temp folder, standing in for a real cloud service in the
# cloud tests: proof that the app side of the contract needs no specific provider, and a backend
# that can genuinely refuse a save rather than an inert stand-in that could never fail. Same
# craft-libs rev as craft-ui.
craft-cloud-local = { git = "https://github.com/storytold/craft-libs", rev = "93dac78c93a7f1fd66e2022edeb089233b1dc45a" }
tempfile = "3"

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
