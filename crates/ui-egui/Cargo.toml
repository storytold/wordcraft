[package]
name = "wordcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
wordcraft-geom = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-chat = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The system's preferred interface languages (#8). Native: OS APIs; wasm: none (English).
sys-locale = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { workspace = true }
wordcraft-chat = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
