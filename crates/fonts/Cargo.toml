[package]
name = "wordcraft-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft fonts: font database (bundled OFL + system), metrics, glyph outlines, shaping"

[lints]
workspace = true

[features]
# Opt-in test harness support; enabling this alone never changes the application database.
test-support = []

[dependencies]
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
wuff = { workspace = true }
brotli-decompressor = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

# The added fonts' catalogue (`fontdb/user/catalog.rs`); the web keeps added fonts in the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde = { workspace = true }
