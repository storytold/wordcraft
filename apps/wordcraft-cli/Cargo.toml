[package]
name = "wordcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[[bin]]
name = "wordcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
# `ask`: GeenioAI, the AI assistant, on a document, through a FANTASTICO account.
wordcraft-assistant = { workspace = true }
wordcraft-fantastico = { workspace = true }
fantastico-sdk = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"
