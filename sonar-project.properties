sonar.projectKey=storytold_wordcraft
sonar.organization=storytold

# Setting test roots disables the CLI default; keep all production sources analyzed.
sonar.sources=.
# These exact fixture runners are tests, not production code. Do not exclude helpers.
sonar.tests=packaging
sonar.test.inclusions=packaging/nightly-tests.py,packaging/nightly-icons-tests.py,packaging/nightly-archive-tests.py,packaging/macos/nightly_plist_tests.py,packaging/macos/nightly_sign_tests.py,packaging/windows/nightly-package-tests.ps1,packaging/windows/nightly-signing-tests.ps1,packaging/nightly-release-tests.py
sonar.python.coverage.reportPaths=python-coverage.xml

# S4790 (weak hash): SHA-1 is a start-key and "SHA1/1K" checksum algorithm that ODF package
# encryption (ODF 1.3 Part 2 §4.16) names, and older office suites wrote it. It is needed to open
# those files, not chosen for new security: WordCraft writes a SHA-256 start key and checksum.
sonar.issue.ignore.multicriteria=odt_sha1
sonar.issue.ignore.multicriteria.odt_sha1.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.odt_sha1.resourceKey=crates/formats/src/odt/crypt.rs

# Packaging scripts and their standalone unittest suites are not measured by Rust llvm-cov.
sonar.coverage.exclusions=packaging/**
