name: Nix

on:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - Cargo.toml
      - Cargo.lock
      - packaging/linux/**
      - assets/app-icon/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - Cargo.toml
      - Cargo.lock
      - packaging/linux/**
      - assets/app-icon/**
      - .github/workflows/nix.yml
  workflow_dispatch:

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    name: nix build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs
      - run: ./result/bin/wordcraft-cli --version
      - run: nix develop --command rustc --version
