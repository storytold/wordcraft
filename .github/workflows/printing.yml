# Exercise the native print host and all UI tests on Windows and macOS on PRs; the broad FreeBSD/ARM64 gates
# stay on their existing nightly/release schedule.
name: Printing

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'craft-i18n.rev'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-web/**'
      - 'crates/ui-egui/**'
      - '.github/workflows/printing.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'craft-i18n.rev'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-web/**'
      - 'crates/ui-egui/**'
      - '.github/workflows/printing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The print host and UI tests on Windows and macOS, through the suite's shared gate: it checks out
  # craft-i18n (craft-i18n.rev) and craft-fonts. Linux is not repeated here: ci.yml's gate runs
  # `cargo xtask ci` there, which already covers fmt, workspace clippy, every test and the wasm build.
  native:
    name: Print
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["windows-latest","macos-latest"]'
      timeout-minutes: 90
      # The catalogs include CJK interface languages, so the UI tests need the suite's fonts, as in
      # the gate (same commit as ci.yml and release.yml).
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      # No nextest: the tests run with cargo test, as before.
      tools: ""
      # Its own cache, apart from ci.yml's gate, which builds the whole workspace.
      cache-version: v1-printing
      # Test binaries without debug info: they link faster and shrink to about a third, and panics
      # keep their file:line.
      dev-strip: true
      # Clippy on its own leg beside the tests, off their critical path. fmt is platform-independent
      # and runs in ci.yml. The web app's wasm build, once: ci.yml's `cargo xtask wasm` checks the
      # library crates and ui-egui, not apps/wordcraft-web.
      lint-command: |
        cargo clippy -p wordcraft -p wordcraft-ui-egui --all-targets --locked -- -D warnings
        if [ "$RUNNER_OS" = macOS ]; then
          cargo check -p wordcraft-web --target wasm32-unknown-unknown --locked
        fi
      command: cargo test -p wordcraft -p wordcraft-ui-egui --locked
