[package]
name = "craft-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Portable Craft menu model and optional Linux desktop integration"
publish = false

[features]
default = []
linux = ["dep:zbus", "dep:x11rb", "dep:raw-window-handle", "dep:winit", "dep:wayland-client", "dep:wayland-protocols-plasma", "dep:log"]
portal = ["dep:zbus", "dep:log"]

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", optional = true, default-features = false, features = ["async-io", "blocking-api"] }
x11rb = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["wayland", "x11", "rwh_06"] }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-plasma = { version = "0.3", optional = true, features = ["client"] }
log = { version = "0.4", optional = true }

[workspace]

[patch.crates-io]
winit = { path = "../winit" }
